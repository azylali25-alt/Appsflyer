services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: appsflyer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appsflyer"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma db push && npm run db:seed && npm start"
volumes:
  pgdata:
